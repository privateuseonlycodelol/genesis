# Inject the overlay skin into HTML responses. Other content types are unchanged.
header_filter_by_lua '
  local ct = ngx.header.content_type
  if ct and string.find(ct, "text/html", 1, true) then
    ngx.header.content_length = nil
    ngx.header["Cache-Control"] = "no-cache"
  end
';

body_filter_by_lua '
  local ct = ngx.header.content_type
  if not ct or not string.find(ct, "text/html", 1, true) then
    return
  end
  local chunk = ngx.arg[1]
  if not chunk or chunk == "" then
    return
  end
  local i = string.find(chunk, "</head>", 1, true)
  if not i then
    return
  end
  local link = [=[<link rel="stylesheet" href="/css/genesis.css?v=2">]=]
  chunk = string.sub(chunk, 1, i - 1) .. link .. string.sub(chunk, i)
  local b = string.find(chunk, "<body", 1, true)
  local e = b and string.find(chunk, ">", b, true)
  if e and not string.find(chunk, "genesis-open", 1, true) then
    local open = [=[<a class="genesis-open" href="/genesis/">Plugins</a>]=]
    chunk = string.sub(chunk, 1, e) .. open .. string.sub(chunk, e + 1)
  end
  ngx.arg[1] = chunk
';
