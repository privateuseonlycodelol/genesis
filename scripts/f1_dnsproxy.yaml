# Local forwarder. The upstream URL is /etc/doh-rilah.url (mode 0600).
# Quad9 is fallback only. It is not in the upstream list.
listen-addrs:
  - "127.0.0.1"
listen-ports:
  - 5053
bootstrap:
  - "9.9.9.9:53"
upstream:
  - "/etc/doh-rilah.url"
fallback:
  - "https://dns.quad9.net/dns-query"
upstream-mode: "load_balance"
cache: true
cache-optimistic: true
optimistic-answer-ttl: 30s
optimistic-max-age: 12h
cache-size: 1048576
timeout: 5s
hosts-file-enabled: false
dnssec: false
