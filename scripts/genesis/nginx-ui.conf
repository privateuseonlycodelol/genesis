# Exact matches are chosen before the catch-all prefix. This build has no
# rewrite module, so both spellings are listed.
location = /genesis/ {
  access_by_lua '
    local mgr = require("web.sessioncontrol").getmgr()
    mgr:checkrequest()
    mgr:handleAuth()
  ';
  content_by_lua_file /genesis/ui.lua;
}

